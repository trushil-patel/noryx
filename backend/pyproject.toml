[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memora-backend"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "supabase>=2.13,<3",
  "google-genai>=1.5,<2", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "trafilatura>=2.0,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/memora"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
